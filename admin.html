<script>
const $ = (s) => document.querySelector(s), E = DB.esc, B = DB.baht;
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._); t._ = setTimeout(() => t.classList.remove('on'), 2400); };
const fmt = (t) => new Date(t).toLocaleString('th-TH');
let tab = 'dash';

/* ===== ล็อกอินแอดมิน ===== */
const SB = DB.mode === 'supabase';
let lastTouch = Date.now();
// โหมด Supabase: สิทธิ์มาจากบัญชีแอดมินจริง (admins table) · โหมดทดลอง: รหัสในเซสชัน — ทั้งสองแบบหมดเวลาเมื่อไม่ใช้งาน 30 นาที
const authed = () => SB ? DB.isAdmin() && Date.now() - lastTouch < 30 * 60000 : (() => { const t = +sessionStorage.getItem('df_admin') || 0; return t > 0 && Date.now() - t < 30 * 60000; })();
function gate() { $('#emailRow').hidden = !SB; $('#gate').classList.toggle('on', !authed()); $('#app').hidden = !authed(); if (authed()) render(); }
$('#fGate').onsubmit = async (e) => { e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true;
  const r = SB ? await DB.adminLogin($('#gemail').value, $('#pin').value) : await DB.adminLogin($('#pin').value); $('#pin').value = ''; btn.disabled = false;
  if (!r.ok) return ($('#eGate').textContent = r.errors[0]);
  $('#eGate').textContent = ''; lastTouch = Date.now(); if (!SB) sessionStorage.setItem('df_admin', String(Date.now())); gate();
  if (r.isDefault) { tab = 'settings'; render(); alert('⚠ ยังใช้รหัสเริ่มต้น กรุณาตั้งรหัสแอดมินใหม่ทันที (แท็บ ตั้งค่า)'); } };
// หมดเวลาถ้าไม่ได้ใช้งาน 30 นาที
const touch = () => { lastTouch = Date.now(); if (!SB && authed()) sessionStorage.setItem('df_admin', String(Date.now())); };
['click', 'keydown'].forEach((ev) => document.addEventListener(ev, touch));
setInterval(async () => { const was = !$('#app').hidden; if (was && !authed()) { if (SB) await DB.logout(); else sessionStorage.removeItem('df_admin'); gate(); alert('หมดเวลาการใช้งาน — กรุณาเข้าสู่ระบบใหม่'); } }, 30000);
$('#out').onclick = async () => { if (SB) await DB.logout(); else sessionStorage.removeItem('df_admin'); gate(); };

/* ===== เมนู ===== */
const TABS = [['dash', '📊 ภาพรวม'], ['me', '👤 โปรไฟล์ของฉัน'], ['orders', '🧾 ออเดอร์/ชำระเงิน'], ['products', '📦 สินค้า'], ['cats', '🗂️ หมวดหมู่'], ['members', '👥 สมาชิก'], ['affiliate', '🪪 ตัวแทนขาย'], ['showcase', '🖥️ ภาพหน้าตาโปรแกรม'], ['releases', '💿 ดาวน์โหลดโปรแกรม'], ['tutorials', '📚 คู่มือ/วิดีโอ'], ['banners', '🖼️ แบนเนอร์โฆษณา'], ['blocks', '🧱 บล็อกหน้าแรก'], ['promos', '🔥 โปรโมชัน'], ['brands', '🏷️ แบรนด์สินค้า'], ['coupons', '🎟️ คูปอง'], ['content', '📝 รีวิว/FAQ'], ['settings', '⚙️ ตั้งค่าหน้าแรก'], ['health', '🩺 ตรวจสอบระบบ'], ['data', '💾 สำรอง/ประวัติ']];
function render() {
  const pend = DB.list('orders').filter((o) => o.status === 'review').length;
  $('#menu').innerHTML = TABS.map(([k, n]) => `<a class="${tab === k ? 'on' : ''}" data-t="${k}">${n}${k === 'orders' && pend ? ` <span class="tag err">${pend}</span>` : ''}</a>`).join('');
  $('#main').innerHTML = V[tab](); (A[tab] || (() => {}))();
}
$('#menu').onclick = (e) => { const a = e.target.closest('[data-t]'); if (a) { tab = a.dataset.t; render(); } };
window.addEventListener('db:change', () => { if (authed()) { if (!$('#mEdit').classList.contains('on') && !$('#mSlip').classList.contains('on')) render(); } else if (!$('#app').hidden) gate(); });

/* ===== ฟอร์มแก้ไขแบบทั่วไป (เพิ่ม/แก้) ===== */
// fields: [{k,label,type,opts,full}]  — คืนค่าผ่าน onSave(obj) → {ok,errors}
function editor(title, fields, obj, onSave) {
  $('#eT').textContent = title;
  $('#eF').innerHTML = '<div class="fgrid">' + fields.map((f) => {
    const v = obj[f.k] ?? '', c = f.full ? 'f full' : 'f';
    if (f.type === 'select') return `<div class="${c}"><label>${f.label}</label><select name="${f.k}" style="width:100%">${f.opts.map(([a, b]) => `<option value="${E(a)}" ${String(v) === String(a) ? 'selected' : ''}>${E(b)}</option>`).join('')}</select></div>`;
    if (f.type === 'textarea') return `<div class="${c}"><label>${f.label}</label><textarea name="${f.k}" rows="3">${E(Array.isArray(v) ? v.join('\n') : v)}</textarea></div>`;
    if (f.type === 'check') return `<div class="${c}"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="${f.k}" style="width:auto" ${v ? 'checked' : ''}> ${f.label}</label></div>`;
    if (f.type === 'file') return `<div class="${c}"><label>${f.label}</label><input type="file" name="${f.k}" accept="${f.accept || ''}"></div>`;
    if (f.type === 'image') return `<div class="${c}"><label>${f.label} (ย่อภาพอัตโนมัติ)</label><input type="file" name="${f.k}_file" accept="image/png,image/jpeg,image/webp"><input type="hidden" name="${f.k}" value="${E(v)}"><img src="${E(v)}" alt="" id="pv_${f.k}" style="max-height:110px;margin-top:6px;border-radius:8px" ${v ? '' : 'hidden'}></div>`;
    if (f.type === 'datetime') { const dt = v ? new Date(v) : null; if (dt) dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset()); return `<div class="${c}"><label>${f.label}</label><input name="${f.k}" type="datetime-local" value="${dt && !isNaN(dt) ? dt.toISOString().slice(0, 16) : ''}"></div>`; }
    return `<div class="${c}"><label>${f.label}</label><input name="${f.k}" type="${f.type || 'text'}" value="${E(v)}" ${f.step ? 'step="' + f.step + '"' : ''}></div>`;
  }).join('') + '</div><div class="errs" id="eErr"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn">💾 บันทึก</button><button type="button" class="btn ghost" id="eCancel">ยกเลิก</button></div>';
  const form = $('#eF'); $('#eCancel').onclick = () => $('#mEdit').classList.remove('on');
  fields.filter((f) => f.type === 'image').forEach((f) => { form[f.k + '_file'].onchange = (e) => { const fl = e.target.files[0]; if (!fl) return; const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, (f.max || 700) / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); form[f.k].value = c.toDataURL('image/jpeg', .78); const pv = $('#pv_' + f.k); pv.src = form[f.k].value; pv.hidden = false; toast('แนบรูปแล้ว'); }; im.onerror = () => alert('อ่านไฟล์ภาพไม่ได้'); im.src = fr.result; }; fr.readAsDataURL(fl); }; });
  form.onsubmit = async (e) => { e.preventDefault(); const o = Object.assign({}, obj); const sbtn = form.querySelector('button:not(.ghost)');
    fields.forEach((f) => { if (f.type === 'image') o[f.k] = form[f.k].value; else if (f.type === 'file') o[f.k] = form[f.k].files[0] || null; else if (f.type === 'datetime') o[f.k] = form[f.k].value ? new Date(form[f.k].value).toISOString() : ''; else if (f.type === 'check') o[f.k] = form[f.k].checked; else if (f.type === 'number') o[f.k] = form[f.k].value === '' ? 0 : Number(form[f.k].value); else if (f.list) o[f.k] = form[f.k].value.split('\n').map((x) => x.trim()).filter(Boolean); else o[f.k] = form[f.k].value.trim(); });
    sbtn.disabled = true; let r; try { r = await onSave(o); } catch (x) { r = { ok: false, errors: [x.message] }; } sbtn.disabled = false; if (!r.ok) { $('#eErr').innerHTML = r.errors.map((x) => '• ' + E(x)).join('<br>'); return; } $('#mEdit').classList.remove('on'); toast('บันทึกแล้ว ✔'); render(); };
  $('#mEdit').classList.add('on');
}
const catOpts = () => DB.list('categories').map((c) => [c.id, c.icon + ' ' + c.name]);
/* หน้าต่างยืนยัน: คืน Promise<boolean> — o = { title, sub, body, rows:[[ป้าย,ค่า]], warn, check, okText, cancelText, danger }
   ปุ่มเริ่มต้นโฟกัสที่ปุ่มยกเลิก กันกด Enter พลาด · Esc / คลิกพื้นหลัง = ปิดโดยไม่ทำอะไร */
function confirmDlg(o) {
  return new Promise((res) => {
    const d = $('#dlg'), f = $('#dlgForm'), ok = $('#dlgOk'), ck = $('#dlgCk'), prev = document.activeElement;
    f.classList.toggle('danger', !!o.danger); f.classList.toggle('okc', !!o.success); $('#dlgCancel').hidden = !!o.hideCancel; // success = หน้าต่างแจ้งผลสำเร็จ (ไอคอนติ๊กถูก) · hideCancel = ปุ่มเดียว
    $('#dlgIc').innerHTML = o.success ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>';
    $('#dlgTitle').textContent = o.title; $('#dlgSub').textContent = o.sub || '';
    const bd = $('#dlgBody'); bd.hidden = !o.body; bd.textContent = o.body || '';
    const rw = $('#dlgRows'); rw.hidden = !(o.rows && o.rows.length); rw.innerHTML = (o.rows || []).map(([k, v]) => '<dt>' + E(k) + '</dt><dd>' + E(v) + '</dd>').join('');
    const w = $('#dlgWarn'); w.hidden = !o.warn; w.textContent = o.warn || '';
    $('#dlgCkW').hidden = !o.check; $('#dlgCkT').textContent = o.check || ''; ck.checked = false;
    ok.textContent = o.okText || 'ตกลง'; $('#dlgCancel').textContent = o.cancelText || 'ยกเลิก'; ok.disabled = !!o.check;
    // fields (ไม่บังคับ): [{k,label,type:'text'|'password'|'textarea'|'check',hint,placeholder,value,rows}] — ผ่านแล้วคืนอ็อบเจ็กต์ค่าที่กรอก · o.validate(values) คืนข้อความผิดพลาดหรือว่าง
    const fl = o.fields || [], fw = $('#dlgFields'), er = $('#dlgErr'); er.hidden = true; fw.hidden = !fl.length;
    fw.innerHTML = fl.map((x) => x.type === 'check'
      ? '<label class="dlg-ck"><input type="checkbox" name="' + E(x.k) + '"' + (x.value ? ' checked' : '') + '><span>' + E(x.label) + '</span></label>'
      : '<label class="dlg-f"><span>' + E(x.label) + '</span>' + (x.type === 'textarea' ? '<textarea name="' + E(x.k) + '" rows="' + (x.rows || 3) + '" placeholder="' + E(x.placeholder || '') + '">' + E(x.value || '') + '</textarea>'
        : '<input name="' + E(x.k) + '" type="' + (x.type || 'text') + '" placeholder="' + E(x.placeholder || '') + '" value="' + E(x.value || '') + '" autocomplete="off">') + (x.hint ? '<small>' + E(x.hint) + '</small>' : '') + '</label>').join('');
    const vals = () => { const v = {}; fl.forEach((x) => { const el = f.elements[x.k]; v[x.k] = x.type === 'check' ? el.checked : el.value.trim(); }); return v; };
    const onKey = (e) => { if (e.key === 'Escape') done(false); };
    const done = (v) => { d.hidden = true; document.removeEventListener('keydown', onKey); f.onsubmit = null; ck.onchange = null; d.onclick = null; $('#dlgCancel').onclick = null; fw.innerHTML = ''; if (prev && prev.focus) prev.focus(); res(v); };
    ck.onchange = () => { ok.disabled = !!o.check && !ck.checked; };
    f.onsubmit = (e) => { e.preventDefault(); if (ok.disabled) return; const v = vals(), msg = o.validate ? o.validate(v) : ''; if (msg) { er.textContent = msg; er.hidden = false; return; } done(fl.length ? v : true); };
    $('#dlgCancel').onclick = () => done(false); d.onclick = (e) => { if (e.target === d) done(false); };
    document.addEventListener('keydown', onKey); d.hidden = false; const first = fw.querySelector('input:not([type=checkbox]),textarea'); (first || (o.hideCancel ? ok : $('#dlgCancel'))).focus();
  });
}

    <img src="${E(slipSrc)}" alt="สลิป" style="max-height:340px;margin:10px auto;border-radius:10px">
    ${can ? `<div class="f"><label>หมายเหตุ (ส่งให้ลูกค้าเมื่อปฏิเสธ)</label><input id="sn"></div><div style="display:flex;gap:8px"><button class="btn" id="ap">✔ อนุมัติ + ออก License key</button><button class="btn danger" id="rj">✕ ปฏิเสธ</button><button class="btn ghost" id="cl">ปิด</button></div>`
    : `<p style="color:var(--mut)">สถานะ: ${E(o.status)}${p.reviewNote ? ' · ' + E(p.reviewNote) : ''}</p>${o.licenseKeys && o.licenseKeys.length ? '<b>🔑 Key:</b> ' + o.licenseKeys.map((k) => '<div><code>' + E(k.key) + '</code> <small>' + E(k.product) + '</small></div>').join('') + '<button class="btn sm" id="cpk" style="margin-top:8px">📋 คัดลอกข้อความส่งลูกค้า</button> ' : ''}${o.status === 'paid' && o.keyStatus === 'pending' ? '<button class="btn sm gold" id="rk">🔁 ออกคีย์ใหม่</button> ' : ''}<button class="btn ghost" id="cl" style="margin-top:10px">ปิด</button>`}`;
  $('#mSlip').classList.add('on'); $('#cl').onclick = () => $('#mSlip').classList.remove('on');
  if ($('#cpk')) $('#cpk').onclick = () => navigator.clipboard.writeText(keyMsg(o)).then(() => toast('คัดลอกแล้ว'));
  if ($('#rk')) $('#rk').onclick = () => { $('#mSlip').classList.remove('on'); retryKeys(id); };
  if (can) { $('#ap').onclick = async () => {
      if (!ok && !confirm('ยอดในสลิปไม่ตรงกับยอดสั่งซื้อ — ยืนยันอนุมัติ?')) return;
      const b = $('#ap'); b.disabled = true; b.textContent = '⏳ กำลังออกคีย์...';
      const r = await DB.reviewPayment(id, true, $('#sn').value); $('#mSlip').classList.remove('on'); render();
      if (!r.ok) return alert(r.errors.join('\n'));
      toast(r.keys.ok ? 'อนุมัติแล้ว' + (r.keys.total ? ' · ออกคีย์ ' + r.keys.issued + ' ดอก ✔' : '') : '⚠ อนุมัติแล้ว แต่ออกคีย์ไม่สำเร็จ: ' + r.keys.errors[0]); };
    $('#rj').onclick = async () => { if (!$('#sn').value.trim()) return alert('ใส่เหตุผลที่ปฏิเสธ'); await DB.reviewPayment(id, false, $('#sn').value.trim()); $('#mSlip').classList.remove('on'); render(); }; }
}
// ข้อความพร้อมส่งลูกค้าทาง LINE/อีเมล (คัดลอกวาง)
function keyMsg(o) { return 'สวัสดีครับ คุณ' + o.customer.name + ' ออเดอร์ ' + o.id + ' ชำระเงินเรียบร้อยแล้ว\nLicense key ของคุณ:\n' + o.licenseKeys.map((k) => '🔑 ' + k.key + ' (' + k.product + ')').join('\n') + '\nเปิดโปรแกรม → ใส่คีย์เพื่อเปิดใช้งาน ขอบคุณครับ 🐾'; }
async function retryKeys(id) { toast('⏳ กำลังออกคีย์...'); const r = await DB.issueKeys(id); render(); toast(r.ok ? 'ออกคีย์ครบแล้ว ✔' : '⚠ ' + r.errors[0]); }
DB.init().then(gate).then(DFCommon.hideSplash).catch((e) => { DFCommon.hideSplash(); $('#eGate').textContent = 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ: ' + (e.message || e); console.error(e); });
</script>
</body>
</html>
